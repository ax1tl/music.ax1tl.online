<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ax1tl.music</title>
    <link rel="icon" type="image/png" href="images/ico.ico"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&family=Bytesized&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet" type="text/css" media="all">

    <meta property="og:title" content="ax1tl.music" />
    <meta property="og:description" content="go make music." />
    <meta property="og:url" content="https://ax1tl.online/music.html" />
    <meta property="og:image" content="https://ax1tl.online/images/icon.png" />
    <meta name="theme-color" content="#ff4422" />
</head>

<body>
    <div class="overlay">
        <img src="images/texture 3.jpg" id="grain_texture">
        <canvas id="noise_texture"></canvas>
        <img src="images/overlay1.png" class="hud_overlay" id="ol1">
        <img src="images/overlay2.png" class="hud_overlay" id="ol2">
        <img src="images/overlay3.png" class="hud_overlay" id="ol3">
        <img src="images/overlay4.png" class="hud_overlay" id="ol4">
        <img src="images/overlay5.png" class="hud_overlay" id="ol5">
        <img src="images/overlay6.png" class="hud_overlay" id="ol6">
        <img src="images/overlay7.png" class="hud_overlay" id="ol7">
    </div>

    <div class="inwrap">
        <h1>
            ax1tl<a href="https://ax1tl.online" id="online_tag">.music</a>
            <div id="tagline">go make music.</div>
        </h1>
        <div class="directory_parent">
            <div class="side_1"></div>

            <div class="directory_list">
                <p class="sb_header">:music</p>
                <div class="album_grid" id="album_grid">
                    <p class="status">loading...</p>
                </div>
            </div>

            <div class="side_2"></div>
        </div>
    </div>

    <script src="site.js"></script>
    <script>
        const grid = document.getElementById('album_grid');

        loadAlbums().then(albums => {
            grid.innerHTML = '';
            if (!albums.length) {
                grid.innerHTML = '<p class="status">nothing here yet.</p>';
                return;
            }
            albums.forEach(album => {
                const href = 'album.html?album=' + encodeURIComponent(album.id);

                const wrap = document.createElement('div');
                wrap.className = 'album';

                const btn = document.createElement('button');
                btn.className = 'Cover';
                btn.setAttribute('aria-label', 'Open ' + album.title);
                btn.onclick = () => { window.location.href = href; };

                const img = document.createElement('img');
                img.src = album.cover;
                img.alt = album.title + ' cover art';
                img.loading = 'lazy';
                btn.appendChild(img);

                const title = document.createElement('a');
                title.href = href;
                title.className = 'album_title';
                title.textContent = album.title;

                wrap.append(btn, title);
                grid.appendChild(wrap);
            });
        }).catch(err => {
            grid.innerHTML = '<p class="status">couldn\'t load albums.</p>';
            console.error(err);
        });

        const canvas = document.getElementById('noise_texture');
        const ctx = canvas.getContext('2d');
        const scale = 1;

        function resizeCanvas() {
          canvas.width = window.innerWidth/scale;
          canvas.height = window.innerHeight/scale;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function generateNoise() {
          const imgData = ctx.createImageData(canvas.width, canvas.height);
          const data = imgData.data;

          for (let i = 0; i < data.length; i += 4) {
            data[i]     = Math.floor(Math.random() * 255);  // red
            data[i + 1] = Math.floor(Math.random() * 255);  // green
            data[i + 2] = Math.floor(Math.random() * 255);  // blue
            data[i + 3] = 100;                              // alpha
          }

          ctx.putImageData(imgData, 0, 0);
          setTimeout(() => {
            requestAnimationFrame(generateNoise);
          }, 10);
        }

        generateNoise();
    </script>

    <div id="version">built with love - v1.0.2</div>
</body>
</html>
